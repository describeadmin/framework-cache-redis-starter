# framework-cache-redis-starter 仓库 CI
#
# 与 framework 仓的 CI 有一个本质区别：本仓库【必须跨版本验证】。
#
# 框架仓只需证明"自己这一版是好的"——它的模块彼此同版本发布，不存在版本组合问题。
# 插件不同：它以 provided 依赖框架，**运行时的框架版本由业务方决定**，
# 不是插件构建时那个。只在一个框架版本上跑绿，等于对"支持 0.2.0+"这句话没有任何证据。
#
# 因此下面的 compat 作业按【框架版本矩阵】跑完整测试，矩阵靠覆盖 POM 的
# describeadmin.version 属性实现。见 docs 仓 registry.md 准入规范第 4、5 条。

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

jobs:
  compat:
    name: 框架 ${{ matrix.framework }}
    runs-on: ubuntu-latest
    strategy:
      # 一个版本挂掉时，其余版本的结果仍然有价值——"从哪个版本开始坏的"正是要看的信息
      fail-fast: false
      matrix:
        # ⚠️ 新增框架版本时，这里、README 的兼容性表格、registry.md 的表格要一起改。
        #    只改一处的话，声明与验证就脱节了，而脱节的那一刻不会有任何报错。
        #
        # 下限固定为 REQUIRED_FRAMEWORK_VERSION（当前 0.2.2——本插件的
        # RedisLockOperations 实现的是 0.2.2 才引入的 LockOperations SPI）。
        # 比它更低的版本连编译都过不去，那正是预期行为，不必也不应放进矩阵。
        #
        # 这个下限跟着 REQUIRED_FRAMEWORK_VERSION 走：常量升上去而矩阵留在旧版本，
        # 唯一那条腿会直接编译失败，兼容性门禁就成了摆设。
        framework: ['0.2.2']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Central 上还没有的版本必须从框架仓源码装一份到本地仓库：SNAPSHOT 是一种，
      # "框架已经打好这一版但尚未发布到 Central"是另一种——插件的下限版本总是先于
      # 框架发布就被提上来（本仓的 0.2.2 就是这个处境），矩阵不能因此红着等。
      # 已发布的版本直接从 Central 解析，不走这一步——那才是业务方的真实处境。
      #
      # 判定用 repo1 直查而不是 dependency:get：后者会命中 actions/cache 恢复出来的
      # 本地仓库，把"上一轮自己从源码装的那份"当成 Central 已有，源码安装被静默跳过。
      - name: 解析框架 ${{ matrix.framework }}（Central 上没有则从源码装）
        run: |
          set -e
          v='${{ matrix.framework }}'
          url="https://repo1.maven.org/maven2/io/github/describeadmin/framework-bom/$v/framework-bom-$v.pom"
          if [ "${v%-SNAPSHOT}" = "$v" ] && curl -fsI "$url" > /dev/null; then
            echo "  ✓ Central 已发布 $v，按业务方的真实处境从 Central 解析"
            exit 0
          fi
          echo "Central 上没有 $v，从框架仓源码安装"
          git clone --depth 1 https://github.com/describeadmin/framework.git /tmp/framework
          actual=$(mvn -B -q -f /tmp/framework/pom.xml -DforceStdout -Dexpression=project.version help:evaluate)
          if [ "$actual" != "$v" ]; then
            echo "::error::框架仓 main 当前是 $actual，矩阵要的是 $v。"
            echo "::error::请更新矩阵，或等框架仓推上对应版本——静默用错版本比直接失败更糟。"
            exit 1
          fi
          mvn -B -f /tmp/framework/pom.xml clean install -DskipTests

      - name: 构建
        run: mvn -B clean install -DskipTests -Ddescribeadmin.version=${{ matrix.framework }}

      - name: 校验字节码版本为 61（Java 17）
        run: |
          set -e
          cls=$(find target/classes -name '*.class' | head -1)
          ver=$(javap -v -p "$cls" | grep -m1 'major version' | grep -oE '[0-9]+')
          [ "$ver" = "61" ] || { echo "::error::字节码版本为 $ver，期望 61（Java 17）"; exit 1; }
          echo "  ✓ major version $ver"

      - name: 校验依赖树中无 JDBC 驱动
        run: |
          # enforcer 已有规则，此处做可见性检查——拆仓后这条规则不再从父 POM 继承，
          # 万一有人"精简"掉了 enforcer 配置，这一步还能兜住
          if mvn -B dependency:tree -Ddescribeadmin.version=${{ matrix.framework }} \
               | grep -iE 'mysql-connector|mariadb-java-client|oceanbase-client'; then
            echo "::error::插件依赖树中出现 JDBC 驱动"; exit 1
          fi
          echo "  ✓ 无 JDBC 驱动"

      # Testcontainers 会拉真实 Redis。用 mock 测 Redis 实现等于把要验证的部分假设成立
      - name: 测试
        run: mvn -B test -Ddescribeadmin.version=${{ matrix.framework }}

      - name: 失败时上传测试报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.framework }}
          path: target/surefire-reports/
          retention-days: 7
